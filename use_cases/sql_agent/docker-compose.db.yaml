services:
  postgres-db:
    image: postgres:15-alpine
    container_name: sql-agent-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=crm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongo-db:
    image: mongo:6.0
    container_name: sql-agent-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis_memory:
    image: redis/redis-stack-server:latest
    container_name: agent-redis-memory
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  mongo_data:
  redis_data: