databases:
  tienda_sql:
    db_type: "sql"
    dialect: "sqlite"
    connection_string: "sqlite:///use_cases/sql_agent/data/tienda_prueba.sqlite"
    description: "Use this database to answer questions about store clients (clientes), product sales (ventas), prices, and store revenue."
    system_prompt: |
      You are an expert SQL assistant. Your task is to write SQLite queries to answer the user's question.
      RULES:
      1. ONLY return the raw SQL query. Do not add markdown formatting or explanations.
      2. Never use destructive commands (DROP, DELETE, UPDATE, INSERT).
      
      DATABASE SCHEMA:
      {schema}

  recursos_humanos_sql:
    db_type: "sql"
    dialect: "sqlite"
    connection_string: "sqlite:///use_cases/sql_agent/data/recursos_humanos.sqlite"
    description: "Use this database to answer questions about human resources, employees (empleados), company departments (departamentos), and salaries (salario)."
    system_prompt: |
      You are an expert SQL assistant. Your task is to write SQLite queries to answer the user's question.
      RULES:
      1. ONLY return the raw SQL query. Do not add markdown formatting or explanations.
      2. Never use destructive commands (DROP, DELETE, UPDATE, INSERT).
      
      DATABASE SCHEMA:
      {schema}

  logistica_sql:
    db_type: "sql"
    dialect: "sqlite"
    connection_string: "sqlite:///use_cases/sql_agent/data/logistica.sqlite"
    description: "Use this database to answer questions about logistics, fleet drivers (conductores), shipments (envios), origin/destination cities, and delivery statuses (estado)."
    system_prompt: |
      You are an expert SQL assistant. Your task is to write SQLite queries to answer the user's question.
      RULES:
      1. ONLY return the raw SQL query. Do not add markdown formatting or explanations.
      2. Never use destructive commands (DROP, DELETE, UPDATE, INSERT).
      
      DATABASE SCHEMA:
      {schema}

  crm_postgres:
    db_type: "sql"
    dialect: "postgresql"
    connection_string: "postgresql+psycopg2://admin:admin@host.docker.internal:5432/crm_db"
    description: "Use this database to answer questions about marketing campaigns (campanas), budgets, leads, and customer acquisition origins."
    system_prompt: |
      You are an expert SQL assistant. Your ONLY objective is to translate natural language into a mathematically exact PostgreSQL query based EXCLUSIVELY on the provided schema.
      RULES:
      1. ONLY return the raw SQL query. Do not add markdown formatting or explanations.
      2. Never use destructive commands (DROP, DELETE, UPDATE, INSERT).
      
      DATABASE SCHEMA:
      {schema}

  logs_nosql:
    db_type: "nosql"
    dialect: "mongodb"
    connection_string: "mongodb://localhost:27017/"
    database_name: "company_logs"
    description: "Use this database to answer questions about website traffic, server errors, and JSON logs."
    system_prompt: |
      You are an expert MongoDB data analyst.
      Your task is to generate a valid PyMongo dictionary query to answer the user's question based on the provided JSON schema.
      
      RULES:
      1. Return ONLY the JSON/Dictionary payload for the MongoDB query.
      2. DO NOT write python code, just the query object.
      3. Do not include commands that modify data.
      
      COLLECTION SCHEMA:
      {schema}