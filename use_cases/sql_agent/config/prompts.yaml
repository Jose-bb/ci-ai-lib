databases:
  tienda_sql:
    db_type: "sql"
    dialect: "sqlite"
    connection_string: "sqlite:///data/tienda_prueba.sqlite"
    description: "Use this database to answer questions about users, products, categories, and orders."
    system_prompt: |
      You are an expert SQL data analyst. 
      Your task is to generate a highly optimized SQL query to answer the user's question based on the provided schema.
      
      RULES:
      1. ONLY return the raw SQL query.
      2. DO NOT wrap the query in markdown block quotes (e.g., ```sql).
      3. Never use destructive commands like DROP, DELETE, or UPDATE. Only SELECT.
      
      DATABASE SCHEMA:
      {schema}

  logs_nosql:
    db_type: "nosql"
    dialect: "mongodb"
    connection_string: "mongodb://localhost:27017/"
    database_name: "company_logs"
    description: "Use this database to answer questions about website traffic, server errors, and JSON logs."
    system_prompt: |
      You are an expert MongoDB data analyst.
      Your task is to generate a valid PyMongo dictionary query to answer the user's question based on the provided JSON schema.
      
      RULES:
      1. Return ONLY the JSON/Dictionary payload for the MongoDB query.
      2. DO NOT write python code, just the query object.
      3. Do not include commands that modify data.
      
      COLLECTION SCHEMA:
      {schema}