<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A2A Swarm - WebSocket Test</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e1e; color: #d4d4d4; padding: 20px; }
        #chat { height: 400px; overflow-y: scroll; background: #2d2d2d; padding: 10px; margin-bottom: 10px; border: 1px solid #3c3c3c; }
        .msg { margin-bottom: 8px; }
        .system { color: #569cd6; }
        .agent { color: #ce9178; }
        .human { color: #4ec9b0; }
        .error { color: #f44747; }
        input, button { padding: 10px; background: #3c3c3c; border: 1px solid #555; color: white; }
        button { cursor: pointer; background: #0e639c; border: none; }
    </style>
</head>
<body>
    <h2>Frontend Simulator - A2A Swarm</h2>
    <div id="chat"></div>
    <input type="text" id="inputBox" placeholder="Type the incident or reply to the AI..." style="width: 70%;">
    <button onclick="sendMessage()">Send via WebSocket</button>

    <script>
        // Connect to the local FastAPI server
        const ws = new WebSocket("ws://localhost:8004/ws/chat");
        const chat = document.getElementById("chat");
        const inputBox = document.getElementById("inputBox");
        let isFirstMessage = true;

        ws.onopen = () => appendLog("System", "Connected to the WebSocket tunnel.", "system");
        ws.onclose = () => appendLog("System", "Connection closed by the server.", "system");
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            if (data.type === "status") {
                appendLog("Backend", data.content, "system");
            } else if (data.type === "agent_message") {
                appendLog(data.sender, data.content, "agent");
            } else if (data.type === "human_input_request") {
                appendLog("SECURITY ALERT", data.prompt, "error");
                appendLog("System", ">> THE AI IS PAUSED. WAITING FOR YOUR REPLY BELOW <<", "system");
            } else if (data.type === "error") {
                appendLog("Error", data.content, "error");
            }
        };

        function sendMessage() {
            const text = inputBox.value.trim();
            if (!text) return;

            appendLog("You", text, "human");
            
            // The first message must be the incident (our Pydantic contract)
            if (isFirstMessage) {
                ws.send(JSON.stringify({ incident: text }));
                isFirstMessage = false;
            } else {
                // Subsequent messages are human replies to the AI
                ws.send(JSON.stringify({ content: text }));
            }
            inputBox.value = "";
        }

        function appendLog(sender, message, cssClass) {
            const div = document.createElement("div");
            div.className = `msg ${cssClass}`;
            div.innerHTML = `<strong>[${sender}]:</strong> ${message.replace(/\n/g, '<br>')}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight; // Auto-scroll
        }
    </script>
</body>
</html>
