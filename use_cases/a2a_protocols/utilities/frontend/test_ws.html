<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A2A Swarm - WebSocket Test</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <h2>Frontend Simulator - A2A Swarm</h2>
    
    <div class="container">
        <div class="chat-section">
            <div id="chat"></div>
        </div>
        
        <div class="telemetry-section">
            <div id="telemetry">
                <h3 class="telemetry-header">Ops & Telemetry</h3>
            </div>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="inputBox" placeholder="Type the incident or reply to the AI...">
        <button onclick="sendMessage()">Send via WebSocket</button>
    </div>

    <script>
        // Connect to the local FastAPI server
        const ws = new WebSocket("ws://localhost:8004/ws/chat");
        const chat = document.getElementById("chat");
        const telemetry = document.getElementById("telemetry");
        const inputBox = document.getElementById("inputBox");
        let isFirstMessage = true;

        ws.onopen = () => appendLog("System", "Connected to the WebSocket tunnel.", "system");
        ws.onclose = () => appendLog("System", "Connection closed by the server.", "system");
        
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            if (data.type === "status") {
                if (data.content.includes("[TELEMETRY]")) {
                    const cleanMsg = data.content.replace("[TELEMETRY] ", "");
                    appendTelemetry(cleanMsg);
                } else {
                    appendLog("Backend", data.content, "system");
                }
            } else if (data.type === "agent_message") {
                appendLog(data.sender, data.content, "agent");
            } else if (data.type === "human_input_request") {
                appendLog("SECURITY ALERT", data.prompt, "error");
                appendLog("System", ">> THE AI IS PAUSED. WAITING FOR YOUR REPLY BELOW <<", "system");
            } else if (data.type === "error") {
                appendLog("Error", data.content, "error");
            }
        };

        function sendMessage() {
            const text = inputBox.value.trim();
            if (!text) return;

            appendLog("You", text, "human");
            
            // The first message must be the incident (our Pydantic contract)
            if (isFirstMessage) {
                ws.send(JSON.stringify({ incident: text }));
                isFirstMessage = false;
            } else {
                // Subsequent messages are human replies to the AI
                ws.send(JSON.stringify({ content: text }));
            }
            inputBox.value = "";
        }

        function appendLog(sender, message, cssClass) {
            const div = document.createElement("div");
            div.className = `msg ${cssClass}`;
            div.innerHTML = `<strong>[${sender}]:</strong> ${message.replace(/\n/g, '<br>')}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight; 
        }

        function appendTelemetry(message) {
            const div = document.createElement("div");
            div.className = "telemetry-item";
            
            const time = new Date().toLocaleTimeString();
            div.innerHTML = `[${time}]<br>${message}`;
            
            telemetry.appendChild(div);
            telemetry.scrollTop = telemetry.scrollHeight;
        }
    </script>
</body>
</html>
